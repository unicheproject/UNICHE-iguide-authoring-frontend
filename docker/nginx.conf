server {
    # The unprivileged nginx image cannot bind ports below 1024.
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles of the current build; revalidate it on every load so a
    # redeploy is picked up. The SPA fallback above also ends here.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime config must never be cached, so a redeploy with new env takes effect immediately.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed build assets are immutable. No fallback here: a missing bundle is a 404, not index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
